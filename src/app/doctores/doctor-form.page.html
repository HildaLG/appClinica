<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/doctores"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ esEdicion() ? 'Editar doctor' : 'Nuevo doctor' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="app-container">
    @if (cargando()) {
      <div class="app-state">
        <ion-spinner></ion-spinner>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
        <ion-item class="app-field" lines="none">
          <ion-input label="Nombre completo" labelPlacement="stacked" fill="outline" formControlName="name"></ion-input>
        </ion-item>
        <app-field-error [control]="form.controls.name" />

        <ion-item class="app-field" lines="none">
          <ion-input label="Correo" labelPlacement="stacked" fill="outline" type="email" formControlName="email"></ion-input>
        </ion-item>
        <app-field-error [control]="form.controls.email" />

        <ion-item class="app-field" lines="none">
          <ion-input label="Teléfono" labelPlacement="stacked" fill="outline" type="tel" formControlName="phone"></ion-input>
        </ion-item>
        <app-field-error [control]="form.controls.phone" />

        <ion-item class="app-field" lines="none">
          <ion-input label="Especialidad" labelPlacement="stacked" fill="outline" formControlName="specialty"></ion-input>
        </ion-item>
        <app-field-error [control]="form.controls.specialty" />

        <ion-item class="app-field" lines="none">
          <ion-input label="Cédula profesional" labelPlacement="stacked" fill="outline" formControlName="license_number"></ion-input>
        </ion-item>
        <app-field-error [control]="form.controls.license_number" />

        @if (errorGeneral(); as mensaje) {
          <p class="app-form-error">{{ mensaje }}</p>
        }

        <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : 'Guardar' }}
        </ion-button>
      </form>
    }
  </div>
</ion-content>
